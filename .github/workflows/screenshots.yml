name: Update screenshots

# Started by hand after a change to the look: Actions → Update screenshots → Run workflow.
# Takes the pictures in docs/screenshots and the format-fidelity references with the real engine
# and a seeded server, in the official Playwright image (same browser and fonts every run), and
# commits the ones that changed.
# It follows firsttris/workflows screenshots.yml, plus the engine cache that one has no input for.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  playwright-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  screenshots:
    needs: [engine, playwright-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    # Two runs at once would push on top of each other
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: engine/dist
          key: ${{ needs.engine.outputs.key }}
          fail-on-cache-miss: true
      # The image has no unzip, which setup-bun needs; npm brings the binary
      - run: npm install --global "bun@$BUN_VERSION"
      - run: bun install --frozen-lockfile
      - run: bun run screenshots
        env:
          HOME: /root
      # The reference pictures of the format-fidelity test (only those that changed)
      - run: bun run fidelity:update
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-report
          path: e2e/test-results
          retention-days: 7
      - uses: firsttris/workflows/actions/commit-changes@v1
        with:
          paths: |
            docs/screenshots
            test-files/fidelity/screenshots
          message: Update screenshots
