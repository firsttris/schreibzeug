name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  # Stage 1: format, lint, types
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  # Stages 2 and 3: unit and integration tests (Vitest)
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The engine (sdkjs, fonts) from the pinned Euro-Office release, cached by its spec
  engine:
    uses: ./.github/workflows/engine.yml

  playwright-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  # Stages 4 to 6: the real engine in a browser, user flows (Playwright)
  e2e:
    needs: [engine, playwright-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: engine/dist
          key: ${{ needs.engine.outputs.key }}
          fail-on-cache-miss: true
      # The Playwright image has Node but no unzip, which setup-bun needs; npm installs Bun instead
      # (as firsttris/workflows screenshots.yml does).
      - run: npm install --global "bun@$BUN_VERSION"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
