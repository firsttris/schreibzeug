<!doctype html>
<!--
  Hosts the PDF editor. It is part of the text-document bundle (sdkjs word/sdk-all-min.js defines
  Asc.PDFEditorApi, pdf/api.js) and loads its renderer, drawingfile.wasm, from
  "../../../../sdkjs/pdf/src/engine/" (pdf/api.js openDocument), so this page sits four folders below
  the engine root like the other editors' pages. packages/editor-core loads it in a same-origin
  iframe and drives the engine through its window; nothing here runs on its own.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Schreibzeug engine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f4f5;
      }
      #thumbnails-list {
        position: absolute;
        inset: 0 auto 0 0;
        width: 180px;
      }
      #editor_sdk {
        position: absolute;
        inset: 0 0 0 180px;
      }
      /* A phone held upright (the app's PHONE, apps/web src/editor/use-mobile-view.ts): the pages
         get the screen's width. The page commands act on the page in view when no thumbnail is
         selected (packages/editor-core pdf.ts selectedPages). */
      @media (max-width: 639px) {
        #thumbnails-list {
          display: none;
        }
        #editor_sdk {
          left: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- The page thumbnails: the engine fills this element on content ready and keeps the page
         selection that rotating, removing and moving pages act on (pdf/api.js
         onDocumentContentReady, pdf/src/thumbnails.js). -->
    <div id="thumbnails-list"></div>
    <div id="editor_sdk"></div>
    <script>
      // The flat look of the canvas controls (scroll bars); web-apps sets the same flag.
      window["flat_desine"] = true;
      // sdkjs catches its own errors and reports them only to the Document Server; show them in
      // the console so tests and developers can see why a document failed to open.
      window.addEventListener("error", (event) => {
        console.error("[engine]", event.message, event.filename + ":" + event.lineno, event.error?.stack ?? "");
      });
      window.addEventListener("unhandledrejection", (event) => {
        console.error("[engine] unhandled rejection", event.reason?.stack ?? String(event.reason));
      });
    </script>
    <script src="../../../../vendor/jquery/jquery.min.js"></script>
    <script src="../../../../vendor/xregexp/xregexp-all-min.js"></script>
    <script src="../../../../sdkjs/common/AllFonts.js"></script>
    <script src="../../../../sdkjs/word/sdk-all-min.js"></script>
  </body>
</html>
