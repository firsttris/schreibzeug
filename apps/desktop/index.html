<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schreibzeug</title>
    <link rel="stylesheet" href="/src/start.css" />
  </head>
  <body>
    <main>
      <h1>Schreibzeug</h1>
      <p id="error" role="alert" hidden></p>
      <section id="local" aria-labelledby="local-title" hidden>
        <h2 id="local-title">Auf diesem Computer</h2>
        <p>Die Dateien im Ordner <strong id="folder"></strong>, ohne Server.</p>
        <div class="row">
          <button id="open-local" type="button">Öffnen</button>
          <button id="change-folder" type="button" class="secondary">Ordner ändern …</button>
        </div>
      </section>
      <section aria-labelledby="server-title">
        <h2 id="server-title">Mit einem Schreibzeug-Server</h2>
        <form id="connect">
          <label for="server">Adresse des Servers</label>
          <input id="server" name="server" placeholder="https://schreibzeug.example.org" autocomplete="url" required />
          <button type="submit">Verbinden</button>
        </form>
        <ul id="recent" aria-label="Zuletzt verbunden"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
