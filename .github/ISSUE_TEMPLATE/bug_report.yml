name: Bug report
description: Something does not work, or a file looks or behaves differently than in the program that made it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a security problem, please do not open an issue: see [SECURITY.md](https://github.com/firsttris/schreibzeug/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. …
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The file
      description: |
        For a rendering or compatibility problem, attach the file that shows it, or a small one that
        reproduces it (please remove anything confidential first). Drag it into this field.
  - type: input
    id: program
    attributes:
      label: Program that made the file
      description: e.g. Microsoft Word 365, LibreOffice 25.8, Google Docs export, a scanner, made in Schreibzeug
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Browser, on a Schreibzeug server
        - Desktop app, files on this computer
        - Desktop app, on a Schreibzeug server
        - Inside Kontext
        - MCP client (AI assistant)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or operating system
      description: e.g. Firefox 140 on Windows 11, Safari on iPhone, the desktop app on Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Schreibzeug version
      description: The image tag the server runs (e.g. tristanteu/schreibzeug:0.1.7) or the desktop app's release
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything from the browser console or the server log (`docker logs schreibzeug`) around the time it happened.
      render: text
