name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  # Stage 1: format, lint, types
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  # Stages 2 and 3: unit and integration tests (Vitest)
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stapel
          POSTGRES_PASSWORD: stapel
          POSTGRES_DB: stapel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stapel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://stapel:stapel@localhost:5432/stapel
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The engine (sdkjs, fonts) from the pinned Euro-Office release, cached by its spec
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=engine-${{ hashFiles('engine/engine.json', 'engine/scripts/prepare.ts', 'engine/frame/**') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: engine/dist
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bun engine/scripts/prepare.ts

  playwright-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  # Stages 4 to 6: the real engine in a browser, user flows (Playwright)
  e2e:
    needs: [engine, playwright-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stapel
          POSTGRES_PASSWORD: stapel
          POSTGRES_DB: stapel
        options: >-
          --health-cmd "pg_isready -U stapel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # The job runs in a container, so the service is reached by its name.
      E2E_DATABASE_URL: postgres://stapel:stapel@postgres:5432/stapel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: engine/dist
          key: ${{ needs.engine.outputs.key }}
          fail-on-cache-miss: true
      # The Playwright image has Node but no unzip, which setup-bun needs; npm installs Bun instead
      # (as firsttris/workflows screenshots.yml does).
      - run: npm install --global "bun@$BUN_VERSION"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
