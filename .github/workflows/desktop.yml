name: Desktop app

# Builds the desktop app (apps/desktop, Tauri) for Windows, macOS and Linux. The app carries the web
# app (built once, on Linux, where the engine is prepared) and the local server (apps/local),
# compiled with Bun for each platform by the app's beforeBuildCommand (scripts/sidecar.ts).
# - Run by hand (Actions → Desktop app → Run workflow): the installers as workflow artifacts.
# - From release.yml on a version tag: the same, and the artifact "schreibzeug-desktop" with all of
#   them, which release.yml's release job attaches to the GitHub release.
# The builds are not signed yet: Windows SmartScreen and macOS Gatekeeper warn on the first start.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  web:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: engine/dist
          key: ${{ needs.engine.outputs.key }}
          fail-on-cache-miss: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # GTK 4.14 or newer for the CEF runtime (tauri-winit-gtk4): Ubuntu 24.04
            runner: ubuntu-24.04
            # Built with the patched Tauri CLI (apps/desktop/patches, scripts/tauri.ts)
            args: --bundles appimage,deb,rpm
          - name: windows
            runner: windows-latest
            args: --bundles msi,nsis
          - name: macos
            runner: macos-latest
            # One app for Intel and Apple silicon.
            args: --target universal-apple-darwin --bundles dmg,app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # GTK 4, which the CEF runtime builds against on Linux (Chromium itself is downloaded by the
      # build, about 1 GB, and kept in the Actions cache). Windows and macOS keep the system webview.
      # From the Actions cache: the runners' Ubuntu mirror is at times very slow (firsttris/workflows)
      - if: matrix.name == 'linux'
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: libgtk-4-dev librsvg2-dev patchelf
      - if: matrix.name == 'linux'
        uses: actions/cache@v6
        with:
          path: .cef
          key: cef-linux-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cef-linux-
      # The patched Tauri CLI for Linux (apps/desktop/patches/README.md), built once per version
      # and patch set. Remove with the patches (issue #12). The key names the CLI's version, not
      # the hash of package.json, whose version every release raises. A release runs on its tag,
      # which reads only its own caches and main's, so ci.yml builds and keeps it on main.
      - if: matrix.name == 'linux'
        id: tauri-cli
        run: echo "key=patched-tauri-cli-$(jq -r '.devDependencies["@tauri-apps/cli"]' apps/desktop/package.json)-${{ hashFiles('apps/desktop/patches/*.patch') }}" >> "$GITHUB_OUTPUT"
      - if: matrix.name == 'linux'
        uses: actions/cache@v6
        with:
          path: apps/desktop/src-tauri/target/patched-cli
          key: ${{ steps.tauri-cli.outputs.key }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      # Builds only: the release is created by release.yml.
      - uses: tauri-apps/tauri-action@v1
        env:
          SCHREIBZEUG_SIDECAR_TARGET: ${{ matrix.name == 'macos' && 'universal-apple-darwin' || '' }}
          # Where the Linux build downloads Chromium (CEF) to, and the cache above keeps it
          CEF_PATH: ${{ matrix.name == 'linux' && format('{0}/.cef', github.workspace) || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: schreibzeug-desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # One artifact with every installer, for the GitHub release (release.yml).
  installers:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: schreibzeug-desktop
          pattern: schreibzeug-desktop-*
          retention-days: 14
