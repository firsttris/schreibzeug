name: CI

# The header as in firsttris/workflows ("CI in every project").
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  # The release runs the same checks before publishing, unless main already ran them (release.yml).
  workflow_call:
  workflow_dispatch:

# A new push to a pull request cancels its outdated run; runs on main and tags finish, so a release
# can count main's run (tested-on-main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  # Stage 1: format, lint, types
  static:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Every interface text in German and English, none left in the code (docs/architecture.md#interface-texts)
      - name: Interface texts
        run: bun run i18n:check

  # Stages 2 and 3: unit and integration tests (Vitest)
  unit:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The desktop app's Rust side (apps/desktop/src-tauri): format, lints, tests
  desktop:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    # GTK 4.14 or newer for the CEF runtime (tauri-winit-gtk4): Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Chromium (CEF, about 1 GB) is downloaded here once and kept in the Actions cache
      CEF_PATH: ${{ github.workspace }}/.cef
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # From the Actions cache: the runners' Ubuntu mirror is at times very slow (firsttris/workflows)
      - uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: libgtk-4-dev librsvg2-dev
      - uses: actions/cache@v4
        with:
          path: .cef
          key: cef-linux-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cef-linux-
      # The patched Tauri CLI the Linux packages are built with (desktop.yml), built here once per
      # version and patch set so main's cache holds it: a release runs on its tag and can read
      # main's caches, not those of the last release's tag.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: tauri-cli
        working-directory: .
        run: echo "key=patched-tauri-cli-$(jq -r '.devDependencies["@tauri-apps/cli"]' apps/desktop/package.json)-${{ hashFiles('apps/desktop/patches/*.patch') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/target/patched-cli
          key: ${{ steps.tauri-cli.outputs.key }}
      - run: bun ../scripts/tauri.ts --version
      # tauri-build checks that what tauri.conf.json bundles exists: the start page (frontendDist),
      # the local server (externalBin) and the web app (resources). Stand-ins do for these checks.
      - run: |
          mkdir -p ../dist binaries ../../web/dist
          touch ../dist/index.html ../../web/dist/index.html binaries/schreibzeug-local-x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # The engine (sdkjs, fonts) from the pinned Euro-Office release, cached by its spec
  engine:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/engine.yml

  playwright-image:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  # Stages 4 to 6: the real engine in a browser, user flows (Playwright), in three shards at once:
  # every test opens the engine anew, so one runner takes about seven minutes for all of them.
  e2e:
    needs: [engine, playwright-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: engine/dist
          key: ${{ needs.engine.outputs.key }}
          fail-on-cache-miss: true
      # The Playwright image has Node but no unzip, which setup-bun needs; npm installs Bun instead
      # (as firsttris/workflows screenshots.yml does).
      - run: npm install --global "bun@$BUN_VERSION"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e --shard=${{ matrix.shard }}/3
        env:
          HOME: /root
      # The ZUGFeRD invoice e2e/e-invoice.spec.ts makes, for the einvoice job to check.
      - uses: actions/upload-artifact@v4
        with:
          name: einvoice-${{ matrix.shard }}
          path: test-results/**/*.zugferd.pdf
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # The e-invoice the E2E tests made, checked by Mustang (ZUGFeRD/mustangproject): the Factur-X XML
  # against its schema and the EN 16931 rules, the PDF against PDF/A-3 (veraPDF). See docs/e-invoice.md.
  einvoice:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: einvoice-*
          merge-multiple: true
          path: einvoices
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: curl -fsSL -o mustang.jar https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/2.26.0/Mustang-CLI-2.26.0.jar
      - name: Validate
        run: |
          files=$(find einvoices -name '*.zugferd.pdf')
          test -n "$files" || { echo "The E2E tests made no e-invoice."; exit 1; }
          for file in $files; do
            java -jar mustang.jar --action validate --source "$file" --no-notices | tee result.xml
            grep -q '<summary status="valid"/>' result.xml
          done
