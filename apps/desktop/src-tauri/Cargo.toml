[package]
name = "schreibzeug-desktop"
version = "0.1.2"
description = "The Schreibzeug desktop app"
license = "AGPL-3.0-only"
repository = "https://github.com/firsttris/schreibzeug"
edition = "2021"
rust-version = "1.80"

[lib]
name = "schreibzeug_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
