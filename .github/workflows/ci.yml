name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  # Stage 1: format, lint, types
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  # Stages 2 and 3: unit and integration tests (Vitest)
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The desktop app's Rust side (apps/desktop/src-tauri): format, lints, tests
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      # tauri-build checks that what tauri.conf.json bundles exists: the start page (frontendDist),
      # the local server (externalBin) and the web app (resources). Stand-ins do for these checks.
      - run: |
          mkdir -p ../dist binaries ../../web/dist
          touch ../dist/index.html ../../web/dist/index.html binaries/schreibzeug-local-x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # The engine (sdkjs, fonts) from the pinned Euro-Office release, cached by its spec
  engine:
    uses: ./.github/workflows/engine.yml

  playwright-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  # Stages 4 to 6: the real engine in a browser, user flows (Playwright), in three shards at once:
  # every test opens the engine anew, so one runner takes about seven minutes for all of them.
  e2e:
    needs: [engine, playwright-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: engine/dist
          key: ${{ needs.engine.outputs.key }}
          fail-on-cache-miss: true
      # The Playwright image has Node but no unzip, which setup-bun needs; npm installs Bun instead
      # (as firsttris/workflows screenshots.yml does).
      - run: npm install --global "bun@$BUN_VERSION"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e --shard=${{ matrix.shard }}/3
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
