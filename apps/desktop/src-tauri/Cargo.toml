[package]
name = "schreibzeug-desktop"
version = "0.1.13"
description = "The Schreibzeug desktop app"
license = "AGPL-3.0-only"
repository = "https://github.com/firsttris/schreibzeug"
edition = "2021"
rust-version = "1.95"

[lib]
name = "schreibzeug_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=3.0.0-alpha.4"

[dependencies]
tauri = "=3.0.0-alpha.5"
tauri-plugin-opener = "=3.0.0-alpha.3"
# GTK 3 by default, which cannot share a process with CEF's GTK 4; Linux uses the portal below.
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# The browser engine. Linux gets Chromium (CEF): WebKitGTK, the system webview there, is the
# slow and uneven one. Windows (WebView2, already Chromium) and macOS (WebKit) keep the system's
# webview. Only one of the two may be in a Linux build: wry builds on GTK 3, CEF on GTK 4.
# Depending on tauri-runtime-cef is also what makes tauri-build and the CLI ship CEF.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = "=3.0.0-alpha.6"
# The folder dialog through the XDG desktop portal (the desktop's own dialog), not GTK 3.
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = "=3.0.0-alpha.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
